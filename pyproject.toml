[project]
name = "neuron-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "fastapi>=0.162.0",
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.21.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuronlab"]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.1.1",
]
